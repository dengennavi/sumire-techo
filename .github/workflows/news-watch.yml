name: 宝塚チケットのお知らせをLINEへ
on:
  schedule:
    - cron: '17 * * * *'   # 1時間ごと（UTC。毎時17分）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: news-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 公式ニュースを確認してLINEに送る
        env:
          LINE_CHANNEL_ID: ${{ secrets.LINE_CHANNEL_ID }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        run: node scripts/watch-news.mjs
      - name: 既読の記録を保存
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/news-seen.json
          git diff --cached --quiet || (git commit -m "お知らせの既読を更新" && git push)
